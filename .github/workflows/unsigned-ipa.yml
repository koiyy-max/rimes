name: Build Unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build unsigned device binary
        run: platforms/ios/scripts/build.sh
      - name: Locate .app and package as IPA
        run: |
          set -euo pipefail
          echo "=== Listing DeviceDerivedData products ==="
          find platforms/ios/build/DeviceDerivedData/Build/Products -maxdepth 2 -type d || true
          # Find the main .app (the one containing PlugIns with .appex = host app)
          APP_PATH="$(find platforms/ios/build/DeviceDerivedData/Build/Products -name '*.app' -type d | while read p; do
            if ls "$p/PlugIns/"*.appex >/dev/null 2>&1; then echo "$p"; break; fi
          done)"
          # Fallback: just take the first .app that is not a Watch app
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find platforms/ios/build/DeviceDerivedData/Build/Products -name '*.app' -type d ! -name '*Watch*' | head -1)"
          fi
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          ls -la "$APP_PATH/PlugIns/" 2>/dev/null || true
          STAGE="$(pwd)/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          # Keyboard extension is nested inside the app; verify it exists
          find "$STAGE/Payload" -name "*.appex" || true
          cd "$STAGE"
          zip -r -9 "$GITHUB_WORKSPACE/RIMES-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/RIMES-unsigned.ipa"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIMES-unsigned-ipa
          path: RIMES-unsigned.ipa
          retention-days: 7
